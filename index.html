<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa">
<meta name="theme-color" content="#FBF7EA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Lista della spesa</title>
<style>
:root{--bg:#FBF7EA;--sheet:#FFFDF4;--ink:#23262B;--mute:#6B6F76;--line:#CBD6E4;--edge:#D8D0B8;--margin:#E48A83;--strike:#D8453B;--acc:#1F5FA8;--onacc:#FFFFFF;--warn:#B3261E;--hl:#E6EEF8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#22252B;--sheet:#2A2E35;--ink:#EDE9DA;--mute:#A6A99F;--line:#3A404A;--edge:#444A55;--margin:#8A4A46;--strike:#FF7A70;--acc:#8DBCF5;--onacc:#0E2238;--warn:#FF8A80;--hl:#34404F}}
:root[data-theme="dark"]{--bg:#22252B;--sheet:#2A2E35;--ink:#EDE9DA;--mute:#A6A99F;--line:#3A404A;--edge:#444A55;--margin:#8A4A46;--strike:#FF7A70;--acc:#8DBCF5;--onacc:#0E2238;--warn:#FF8A80;--hl:#34404F}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%}
body{font:24px/1.25 Caveat,"Bradley Hand","Segoe Print","Comic Sans MS",cursive;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:inherit;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sheet);border:2px solid var(--ink);border-radius:8px;padding:6px 12px;min-height:46px;width:100%}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:0 14px 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.top h1{font-size:40px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.1}
.pri{background:var(--acc);color:var(--onacc);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;padding:0 18px;min-height:46px;font-weight:700;text-align:center;white-space:nowrap}
.pri.full{width:100%}
.pri.danger{background:var(--warn);color:#fff}
.ghost{border:2px solid var(--ink);background:transparent;border-radius:255px 14px 225px 14px/14px 225px 14px 255px;padding:0 16px;min-height:44px;display:inline-flex;align-items:center;white-space:nowrap;font-weight:600}
.danger{color:var(--warn)}
.ghost.danger{border-color:var(--warn)}
.mu{color:var(--mute);font-size:21px}
.card{background:var(--sheet);border:1.5px solid var(--edge);border-radius:8px;box-shadow:2px 3px 0 rgba(0,0,0,.08);margin:0 0 12px;overflow:hidden;position:relative}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.lnk{display:block;width:100%;padding:10px 14px}
.lnk b{display:block;font-size:30px;line-height:1.1}
.acts{display:flex;gap:8px;padding:0 14px 12px}
.bar{display:flex;gap:8px;margin:0 0 14px}
.bar>*{flex:1}
.seg{display:flex;border:2px solid var(--ink);border-radius:10px;padding:3px;margin:0 0 14px}
.seg button{flex:1;text-align:center;min-height:42px;border-radius:7px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.num{display:inline-grid;place-items:center;min-width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;font-weight:700;font-size:21px;line-height:1}
.shd{display:flex;align-items:center;gap:12px;width:100%;padding:8px 14px;min-height:54px;font-size:28px}
.cnt{color:var(--mute)}
.sb{border-top:1.5px solid var(--edge);padding:4px 14px 12px}
.it{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--line);font-size:27px}
.x{width:44px;height:44px;text-align:center;font-size:30px;color:var(--mute)}
.add{display:flex;gap:8px;margin-top:10px}
.ruled{background-image:repeating-linear-gradient(var(--sheet) 0 43px,var(--line) 43px 44px)}
.ruled::before{content:"";position:absolute;left:44px;top:0;bottom:0;width:2px;background:var(--margin)}
.gh{height:44px;line-height:44px;padding:0 12px 0 58px;font-size:30px;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;color:var(--ink)}
.buy{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 12px 0 58px;font-size:30px;line-height:44px}
.box{position:relative;width:24px;height:24px;border:2px solid var(--ink);border-radius:4px;flex:none}
.box svg{position:absolute;left:-2px;top:-10px;width:28px;height:28px;stroke:var(--acc)}
.tx{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.buy.ck .tx{color:var(--mute);background:linear-gradient(var(--strike),var(--strike)) 0 58%/100% 4px no-repeat}
.buy.fresh .tx{animation:mark .3s ease-out}
@keyframes mark{from{background-size:0 4px}to{background-size:100% 4px}}
.tgl{display:flex;align-items:center;gap:8px;min-height:44px}
.tgl input{width:24px;min-height:24px;height:24px}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
.ic{min-width:44px;height:44px;text-align:center;font-size:28px;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:14px}
.md{background:var(--sheet);border:1.5px solid var(--edge);border-radius:12px;padding:18px;width:100%;max-width:520px;display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.md p{margin:0;color:var(--mute)}
.md .bt{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.buy.fresh .tx{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const KEY='spesa.v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.shops)S={shops:[],lists:[],showCats:true};
S.sync=S.sync||{last:{},cursor:null,group:null,code:null};
const uid=()=>Math.random().toString(36).slice(2,9);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function seed(){if(!S.shops.length){S.shops.push({id:uid(),name:'Il mio supermercato',cats:['Frutta e verdura','Forneria','Latticini e uova','Reparto carne','Reparto pesce','Dispensa','Surgelati','Bevande','Detersivi e igiene'].map(n=>({id:uid(),name:n}))});save()}}
seed();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
let view={n:'home'};
const cur=()=>S.lists.find(l=>l.id===view.id);
const shopOf=l=>S.shops.find(s=>s.id===l.shopId);
const curShop=()=>S.shops.find(s=>s.id===view.id);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

function modal({title,msg,input,select,ok='Salva',danger,cb}){
 const m=document.createElement('div');m.className='ov';
 const fld=input?(input.rows>1?`<textarea rows="${input.rows}"></textarea>`:`<input autocomplete="off">`):'';
 m.innerHTML=`<div class="md" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${msg?`<p>${esc(msg)}</p>`:''}${select?`<select>${select.map(o=>`<option value="${o.v}">${esc(o.t)}</option>`).join('')}</select>`:''}${fld}<div class="bt"><button class="ghost" data-x="0">Annulla</button><button class="pri ${danger?'danger':''}" data-x="1">${esc(ok)}</button></div></div>`;
 document.body.appendChild(m);
 const f=m.querySelector('input,textarea'),s=m.querySelector('select');
 if(f){f.value=input.value||'';f.placeholder=input.ph||'';setTimeout(()=>{f.focus();f.select()},50)}
 const close=()=>m.remove();
 const go=()=>{const t=f?f.value.trim():'';if(f&&!t&&!input.empty)return;close();cb({text:t,sel:s?s.value:null})};
 m.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(b){b.dataset.x==='1'?go():close()}else if(e.target===m)close()});
 if(f&&input.rows<=1)f.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}

function groups(l){const sh=shopOf(l);const g=sh.cats.map((c,i)=>({id:c.id,name:c.name,n:i+1,items:l.items.filter(x=>x.cat===c.id)}));const known=new Set(sh.cats.map(c=>c.id));const o=l.items.filter(x=>!known.has(x.cat));if(o.length)g.push({id:'_',name:'Senza categoria',n:'?',items:o});return g}

function home(){
 const ls=S.lists.map(l=>{const sh=shopOf(l),t=l.items.length,d=l.items.filter(i=>i.ck).length;
  return `<div class="card"><button class="lnk" data-act="open" data-id="${l.id}"><b>${esc(l.name)}</b><span class="mu">${esc(sh?sh.name:'Senza supermercato')}, ${d} di ${t} presi</span></button><div class="acts"><button class="ghost" data-act="dup" data-id="${l.id}">Duplica</button><button class="ghost danger" data-act="del" data-id="${l.id}">Elimina</button></div></div>`}).join('');
 return `<div class="top"><h1>Liste della spesa</h1></div><button class="pri full" data-act="newlist" style="margin-bottom:10px">Nuova lista</button><div class="bar"><button class="ghost" data-act="imp">Importa</button><button class="ghost" data-act="shops">Supermercati</button><button class="ghost" data-act="acc">Account</button></div>${U&&S.sync.group?`<p class="mu" id="st" style="margin:0 0 10px">${esc(ST||'Liste condivise con il gruppo')}</p>`:''}${ls||'<div class="empty">Nessuna lista. Tocca «Nuova lista» per iniziare.</div>'}`;
}

function listView(){
 const l=cur();if(!l)return home();const sh=shopOf(l);
 const head=`<div class="top"><button class="ghost" data-act="home" aria-label="Torna alle liste">‹ Liste</button><h1 data-act="ren">${esc(l.name)}</h1><button class="ghost" data-act="share">Condividi</button></div><p class="mu" style="margin:0 0 10px">${esc(sh?sh.name:'')}</p><div class="seg"><button class="${view.mode==='edit'?'on':''}" data-act="mode" data-m="edit">Compila</button><button class="${view.mode==='shop'?'on':''}" data-act="mode" data-m="shop">Spesa</button></div>`;
 if(!sh)return head+'<div class="empty">Supermercato non trovato.</div>';
 const gs=groups(l);
 if(view.mode==='edit'){
  return head+gs.map(g=>{const open=view.open.has(g.id);
   return `<section class="card"><button class="shd" data-act="tog" data-cat="${g.id}" aria-expanded="${open}"><span class="num">${g.n}</span><span class="grow">${esc(g.name)}</span><span class="cnt">${g.items.length||''}</span><span class="mu">${open?'▾':'▸'}</span></button>${open?`<div class="sb">${g.items.map(i=>`<div class="it"><span class="grow">${esc(i.t)}</span><button class="x" data-act="rm" data-item="${i.id}" aria-label="Elimina ${esc(i.t)}">×</button></div>`).join('')}${g.id==='_'?'':`<form class="add" data-cat="${g.id}"><input data-in="${g.id}" placeholder="Aggiungi articolo" enterkeyhint="done" autocomplete="off"><button class="pri">Aggiungi</button></form>`}</div>`:''}</section>`}).join('');
 }
 const full=gs.filter(g=>g.items.length),t=l.items.length,d=l.items.filter(i=>i.ck).length;
 if(!t)return head+'<div class="empty">Nessun articolo. Passa a «Compila» per aggiungerne.</div>';
 return head+`<div class="row" style="justify-content:space-between;margin-bottom:10px"><label class="tgl"><input type="checkbox" data-act="togcats" ${S.showCats?'checked':''}> Mostra reparti</label><span class="mu">${d} di ${t} presi</span></div><div class="card ruled">${full.map(g=>(S.showCats?`<h3 class="gh">${g.n}. ${esc(g.name)}</h3>`:'')+g.items.map(i=>`<button class="buy ${i.ck?'ck':''} ${i.id===view.just?'fresh':''}" data-act="ck" data-item="${i.id}" aria-pressed="${!!i.ck}"><span class="box">${i.ck?CHK:''}</span><span class="tx">${esc(i.t)}</span></button>`).join('')).join('')}</div>${d?'<button class="ghost" data-act="reset">Azzera le spunte</button>':''}`;
}

function shopsView(){
 return `<div class="top"><button class="ghost" data-act="home">‹ Liste</button><h1>Supermercati</h1></div>${S.shops.map(s=>`<div class="card"><button class="lnk" data-act="openshop" data-id="${s.id}"><b>${esc(s.name)}</b><span class="mu">${s.cats.length} reparti</span></button></div>`).join('')}<button class="pri full" data-act="newshop">Nuovo supermercato</button>`;
}

function shopView(){
 const s=curShop();if(!s)return shopsView();
 return `<div class="top"><button class="ghost" data-act="shops">‹ Indietro</button><h1 data-act="rensh">${esc(s.name)}</h1></div><p class="mu" style="margin:0 0 10px">I reparti seguono il percorso nel supermercato. Usa le frecce per cambiare l'ordine.</p>${s.cats.map((c,i)=>`<div class="card row"><span class="num" style="margin-left:14px">${i+1}</span><button class="grow lnk" style="padding:12px 4px" data-act="rencat" data-cat="${c.id}">${esc(c.name)}</button><button class="ic" data-act="up" data-cat="${c.id}" aria-label="Sposta su">↑</button><button class="ic" data-act="down" data-cat="${c.id}" aria-label="Sposta giù">↓</button><button class="ic" data-act="delcat" data-cat="${c.id}" aria-label="Elimina reparto">×</button></div>`).join('')}<form class="add addc" style="margin:14px 0"><input data-in="newcat" placeholder="Nuovo reparto" autocomplete="off"><input type="number" inputmode="numeric" min="1" placeholder="Pos." style="width:78px" data-pos><button class="pri">Aggiungi</button></form><button class="ghost danger" data-act="delsh">Elimina supermercato</button>`;
}

function render(){
 const y=window.scrollY,n=view.n+(view.id||'');
 app.innerHTML=view.n==='home'?home():view.n==='acc'?accView():view.n==='list'?listView():view.n==='shops'?shopsView():shopView();
 if(render.last===n)window.scrollTo(0,y);else window.scrollTo(0,0);
 render.last=n;view.just=null;
 if(view.focus){const e=app.querySelector(`[data-in="${view.focus}"]`);if(e)e.focus();view.focus=null}
}
const commit=()=>{save();render();schedulePush()};
const dateName=()=>'Spesa del '+new Date().toLocaleDateString('it-IT',{day:'numeric',month:'long'});

const CHK='<svg viewBox="0 0 26 26" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14l6 6L23 5"/></svg>';
const A={
 acc(){view={n:'acc'}},login(){doAuth(false)},signup(){doAuth(true)},logout(){doLogout()},mkgroup(){mkGroup()},joingroup(){joinGroup()},syncnow(){pull().then(push)},
 home(){view={n:'home'}},
 shops(){view={n:'shops'}},
 open(e){view={n:'list',id:e.dataset.id,mode:'edit',open:new Set()}},
 newlist(){modal({title:'Nuova lista',input:{value:dateName()},select:S.shops.length>1?S.shops.map(s=>({v:s.id,t:s.name})):null,ok:'Crea',cb:r=>{const l={id:uid(),name:r.text,shopId:r.sel||S.shops[0].id,items:[]};S.lists.unshift(l);view={n:'list',id:l.id,mode:'edit',open:new Set()};commit()}})},
 imp(){modal({title:'Importa lista',msg:'Incolla il link ricevuto.',input:{rows:4,ph:'Link della lista'},ok:'Importa',cb:r=>importCode(r.text)})},
 dup(e){const l=S.lists.find(x=>x.id===e.dataset.id);S.lists.unshift({id:uid(),name:l.name+' (copia)',shopId:l.shopId,items:l.items.map(i=>({id:uid(),cat:i.cat,t:i.t,ck:false}))});toast('Lista duplicata')},
 del(e){const l=S.lists.find(x=>x.id===e.dataset.id);modal({title:'Eliminare la lista?',msg:'«'+l.name+'» verrà eliminata.',ok:'Elimina',danger:1,cb:()=>{S.lists=S.lists.filter(x=>x.id!==l.id);commit()}})},
 ren(){const l=cur();modal({title:'Nome della lista',input:{value:l.name},cb:r=>{l.name=r.text;commit()}})},
 share(){share()},
 mode(e){view.mode=e.dataset.m},
 tog(e){const s=view.open,k=e.dataset.cat;s.has(k)?s.delete(k):s.add(k);if(s.has(k))view.focus=k},
 rm(e){const l=cur();l.items=l.items.filter(i=>i.id!==e.dataset.item)},
 ck(e){const i=cur().items.find(i=>i.id===e.dataset.item);i.ck=!i.ck;view.just=i.ck?i.id:null},
 togcats(){S.showCats=!S.showCats},
 reset(){cur().items.forEach(i=>i.ck=false)},
 openshop(e){view={n:'shop',id:e.dataset.id}},
 newshop(){modal({title:'Nuovo supermercato',input:{value:''},select:[{v:'',t:'Parti da un elenco vuoto'}].concat(S.shops.map(s=>({v:s.id,t:'Copia i reparti di '+s.name}))),ok:'Crea',cb:r=>{const src=S.shops.find(s=>s.id===r.sel);const s={id:uid(),name:r.text,cats:src?src.cats.map(c=>({id:uid(),name:c.name})):[]};S.shops.push(s);view={n:'shop',id:s.id};commit()}})},
 rensh(){const s=curShop();modal({title:'Nome del supermercato',input:{value:s.name},cb:r=>{s.name=r.text;commit()}})},
 delsh(){const s=curShop();if(S.lists.some(l=>l.shopId===s.id))return toast('Ci sono liste che usano questo supermercato');if(S.shops.length<2)return toast('Serve almeno un supermercato');modal({title:'Eliminare il supermercato?',msg:'«'+s.name+'» e i suoi reparti verranno eliminati.',ok:'Elimina',danger:1,cb:()=>{S.shops=S.shops.filter(x=>x.id!==s.id);view={n:'shops'};commit()}})},
 rencat(e){const c=curShop().cats.find(c=>c.id===e.dataset.cat);modal({title:'Nome del reparto',input:{value:c.name},cb:r=>{c.name=r.text;commit()}})},
 up(e){mv(e.dataset.cat,-1)},
 down(e){mv(e.dataset.cat,1)},
 delcat(e){const s=curShop(),c=s.cats.find(c=>c.id===e.dataset.cat);modal({title:'Eliminare il reparto?',msg:'Gli articoli di «'+c.name+'» nelle liste resteranno sotto «Senza categoria».',ok:'Elimina',danger:1,cb:()=>{s.cats=s.cats.filter(x=>x.id!==c.id);commit()}})}
};
function mv(id,d){const a=curShop().cats,i=a.findIndex(c=>c.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const f=A[el.dataset.act];if(f){f(el);commit()}});
document.addEventListener('change',e=>{if(e.target.dataset.act==='togcats'){A.togcats();commit()}});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,inp=f.querySelector('input');const t=inp.value.trim();if(!t)return;
 if(f.classList.contains('addc')){const s=curShop(),c={id:uid(),name:t},p=parseInt(f.querySelector('[data-pos]').value,10);
  if(p>=1&&p<=s.cats.length)s.cats.splice(p-1,0,c);else s.cats.push(c);view.focus='newcat'}
 else{cur().items.push({id:uid(),cat:f.dataset.cat,t,ck:false});view.focus=f.dataset.cat}
 commit();
});

const enc=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const dec=c=>{c=c.replace(/-/g,'+').replace(/_/g,'/');while(c.length%4)c+='=';const s=atob(c),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return JSON.parse(new TextDecoder().decode(b))};

async function share(){
 const l=cur(),sh=shopOf(l);
 const p={n:l.name,s:sh.name,c:sh.cats.map(c=>c.name),i:l.items.map(i=>[sh.cats.findIndex(c=>c.id===i.cat),i.t,i.ck?1:0])};
 const url=location.href.split('#')[0]+'#import='+enc(p);
 try{if(navigator.share){await navigator.share({title:'Lista: '+l.name,text:'Lista della spesa «'+l.name+'». Apri il link per importarla:',url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(url);toast('Link copiato')}catch(e){modal({title:'Copia il link',input:{value:url,rows:5},ok:'Chiudi',cb(){}})}
}

function importCode(t){
 try{
  const m=t.match(/import=([A-Za-z0-9_-]+)/),p=dec(m?m[1]:t.trim());
  let sh=S.shops.find(s=>s.name.toLowerCase()===String(p.s).toLowerCase());
  if(!sh){sh={id:uid(),name:p.s,cats:[]};S.shops.push(sh)}
  const ids=p.c.map(n=>{let c=sh.cats.find(c=>c.name.toLowerCase()===n.toLowerCase());if(!c){c={id:uid(),name:n};sh.cats.push(c)}return c.id});
  const l={id:uid(),name:p.n,shopId:sh.id,items:p.i.map(([ci,t,ck])=>({id:uid(),cat:ids[ci]||'_x',t,ck:!!ck}))};
  S.lists.unshift(l);view={n:'list',id:l.id,mode:'edit',open:new Set()};commit();toast('Lista importata');
 }catch(e){toast('Link non valido')}
}

const SB_URL='https://etmgilmdmvotppzmdihw.supabase.co',SB_KEY='sb_publishable_SvX8vscPGjgJNlZhx1Zwxw_smp5kX-4';
let sb=null,U=null,chan=null,ST='',pushing=false,pt;
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const $v=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const cj=v=>Array.isArray(v)?'['+v.map(cj).join(',')+']':v&&typeof v==='object'?'{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+cj(v[k])).join(',')+'}':JSON.stringify(v);
function setSt(t){ST=t;const e=document.getElementById('st');if(e)e.textContent=t}
const live=()=>sb&&U&&S.sync.group;
function flat(){const o={};S.shops.forEach(s=>o['s:'+s.id]=cj({name:s.name,cats:s.cats}));S.lists.forEach(l=>{o['l:'+l.id]=cj({name:l.name,shop:l.shopId});l.items.forEach(i=>o['i:'+i.id]=cj({l:l.id,c:i.cat,t:i.t,k:i.ck?1:0}))});return o}
function schedulePush(){clearTimeout(pt);pt=setTimeout(push,500)}
async function push(){
 if(!live()||pushing)return;
 const cur=flat(),L=S.sync.last,rows=[],now=Date.now();
 for(const k in cur)if(cur[k]!==L[k])rows.push({tipo:k[0],id:k.slice(2),dati:JSON.parse(cur[k]),ts:now});
 for(const k in L)if(!(k in cur))rows.push({tipo:k[0],id:k.slice(2),dati:null,ts:now,del:true});
 if(!rows.length)return;
 pushing=true;
 const {error}=await sb.rpc('scrivi_righe',{p_gruppo:S.sync.group,p_righe:rows});
 pushing=false;
 if(error){setSt('Non sincronizzato: '+(error.message||'errore'));return}
 rows.forEach(r=>{const k=r.tipo+':'+r.id;if(r.del)delete L[k];else L[k]=cur[k]});
 save();setSt('Sincronizzato');schedulePush();
}
function ap(r){const d=r.dati;
 if(r.tipo==='s'){let s=S.shops.find(x=>x.id===r.id);if(!s)S.shops.push(s={id:r.id});s.name=d.name;s.cats=d.cats}
 else if(r.tipo==='l'){let l=S.lists.find(x=>x.id===r.id);if(!l)S.lists.unshift(l={id:r.id,items:[]});l.name=d.name;l.shopId=d.shop}
 else{const l=S.lists.find(x=>x.id===d.l);if(!l)return false;let i=l.items.find(x=>x.id===r.id);if(!i)l.items.push(i={id:r.id});i.cat=d.c;i.t=d.t;i.ck=!!d.k}}
function rm(r){if(r.tipo==='s')S.shops=S.shops.filter(x=>x.id!==r.id);else if(r.tipo==='l')S.lists=S.lists.filter(x=>x.id!==r.id);else S.lists.forEach(l=>l.items=l.items.filter(i=>i.id!==r.id))}
function soft(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;render()}
async function pull(){
 if(!live())return;
 if(!S.sync.code){const c=await sb.from('gruppi').select('codice').eq('id',S.sync.group).single();if(c.data){S.sync.code=c.data.codice;save();if(view.n==='acc')render()}}
 let q=sb.from('righe').select('tipo,id,dati,ts,del,agg').eq('gruppo',S.sync.group).order('agg');
 if(S.sync.cursor)q=q.gt('agg',new Date(Date.parse(S.sync.cursor)-5000).toISOString());
 const {data,error}=await q;
 if(error){setSt('Non sincronizzato: '+(error.message||'errore'));return}
 if(!data.length){setSt('Sincronizzato');return}
 const last=data[data.length-1].agg,ord={s:0,l:1,i:2},cur=flat(),L=S.sync.last;let ch=false;
 data.sort((a,b)=>ord[a.tipo]-ord[b.tipo]);
 for(const r of data){
  const k=r.tipo+':'+r.id;
  if(cur[k]!==L[k])continue;
  if(r.del){if(cur[k]!==undefined){rm(r);ch=true}delete L[k];continue}
  const js=cj(r.dati);
  if(cur[k]!==js){if(ap(r)===false)continue;ch=true}
  L[k]=js;
 }
 if(!S.sync.cursor||last>S.sync.cursor)S.sync.cursor=last;
 save();setSt('Sincronizzato');if(ch)soft();
}
function sub(){
 if(chan){sb.removeChannel(chan);chan=null}
 if(!live())return;
 chan=sb.channel('g'+S.sync.group).on('postgres_changes',{event:'*',schema:'public',table:'righe',filter:'gruppo=eq.'+S.sync.group},()=>pull()).subscribe();
}
async function adopt(g,code,created){
 if(S.sync.group===g){S.sync.code=code;save();await pull();await push();sub();render();return}
 const go=async keep=>{
  if(!keep){S.shops=[];S.lists=[]}
  S.sync={last:{},cursor:null,group:g,code};save();
  await pull();seed();await push();sub();view={n:'acc'};render();
 };
 if(created||!S.lists.length)return go(created);
 modal({title:'Liste già presenti',msg:'Su questo telefono ci sono già delle liste. Cosa vuoi fare?',select:[{v:'1',t:'Aggiungile al gruppo'},{v:'0',t:'Scartale e usa quelle del gruppo'}],ok:'Continua',cb:r=>go(r.sel==='1')});
}
async function findGroup(){
 const {data}=await sb.from('membri').select('gruppo').limit(1);
 if(data&&data[0]){const g=data[0].gruppo,c=await sb.from('gruppi').select('codice').eq('id',g).single();await adopt(g,c.data?c.data.codice:'',false)}
}
async function doAuth(reg){
 const email=$v('em'),pw=$v('pw');
 if(!email||!pw)return toast('Inserisci email e password');
 if(!sb)return toast('Servizio non raggiungibile');
 const r=reg?await sb.auth.signUp({email,password:pw}):await sb.auth.signInWithPassword({email,password:pw});
 if(r.error||!r.data.session){
  toast(r.error?(reg?'Registrazione non riuscita':'Email o password non corretti'):'Controlla la mail per confermare');
  const a=document.getElementById('em');if(a)a.value=email;return}
 U=r.data.session.user;await findGroup();render();
}
async function doLogout(){await sb.auth.signOut();U=null;if(chan){sb.removeChannel(chan);chan=null}setSt('');render()}
async function mkGroup(){
 const {data:g,error}=await sb.rpc('crea_gruppo');
 if(error)return toast('Impossibile creare il gruppo');
 const c=await sb.from('gruppi').select('codice').eq('id',g).single();
 adopt(g,c.data?c.data.codice:'',true);
}
async function joinGroup(){
 const code=$v('cd').toUpperCase();if(!code)return toast('Inserisci il codice');
 const {data:g,error}=await sb.rpc('entra_gruppo',{p_codice:code});
 if(error)return toast('Codice non valido o gruppo pieno');
 adopt(g,code,false);
}
function accView(){
 const top='<div class="top"><button class="ghost" data-act="home">‹ Liste</button><h1>Account</h1></div>',bx='<div class="card" style="padding:14px;display:grid;gap:10px">',p='<p style="margin:0">',m='<p class="mu" style="margin:0">';
 if(!sb)return top+'<div class="empty">Servizio non raggiungibile. Controlla la connessione e riapri l\'app.</div>';
 if(!U)return top+bx+m+'Accedi per condividere le liste con l\'altra persona.</p><input id="em" type="email" placeholder="Email" autocomplete="username" autocapitalize="none"><input id="pw" type="password" placeholder="Password (almeno 6 caratteri)" autocomplete="current-password"><button class="pri" data-act="login">Accedi</button><button class="ghost" data-act="signup" style="justify-content:center">Registrati</button></div>';
 const who=p+'Connesso come <b>'+esc(U.email||'')+'</b></p>';
 if(!S.sync.group)return top+bx+who+'<button class="pri" data-act="mkgroup">Crea il gruppo</button>'+m+'Oppure inserisci il codice che ti ha dato l\'altra persona:</p><input id="cd" placeholder="Codice del gruppo" autocapitalize="characters" autocomplete="off"><button class="ghost" data-act="joingroup" style="justify-content:center">Entra nel gruppo</button><button class="ghost" data-act="logout">Esci</button></div>';
 return top+bx+who+p+'Codice del gruppo: <b style="font-size:34px;letter-spacing:2px">'+esc(S.sync.code||'')+'</b></p>'+m+'Dallo all\'altra persona: dopo la registrazione lo inserirà per entrare.</p><p class="mu" id="st" style="margin:0">'+esc(ST||'Sincronizzato')+'</p><button class="pri" data-act="syncnow">Sincronizza ora</button><button class="ghost" data-act="logout">Esci</button></div>';
}
async function startSync(){
 if(!sb)return;
 try{
  const {data}=await sb.auth.getSession();U=data.session?data.session.user:null;
  sb.auth.onAuthStateChange((ev,ses)=>{U=ses?ses.user:null});
  if(U){if(!S.sync.group)await findGroup();else{await pull();await push();sub()}}
  render();
 }catch(e){}
}

addEventListener('online',()=>{pull().then(push)});
setInterval(()=>{if(!document.hidden)pull()},30000);
render();startSync();
