<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spesa">
<meta name="theme-color" content="#0F6B5C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Lista della spesa</title>
<style>
:root{--bg:#F2F5F1;--card:#FFFFFF;--ink:#16231D;--mute:#68786F;--line:#DAE2DC;--acc:#0F6B5C;--onacc:#FFFFFF;--warn:#B3261E;--hl:#E1F0E8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1713;--card:#18231D;--ink:#E7EEE9;--mute:#93A39A;--line:#2A3830;--acc:#4FC3A6;--onacc:#06231B;--warn:#FF8A80;--hl:#1F3329}}
:root[data-theme="dark"]{--bg:#0F1713;--card:#18231D;--ink:#E7EEE9;--mute:#93A39A;--line:#2A3830;--acc:#4FC3A6;--onacc:#06231B;--warn:#FF8A80;--hl:#1F3329}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);min-height:100%}
body{font:17px/1.35 -apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:left}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:0 14px 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px}
.top h1{font-size:25px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pri{background:var(--acc);color:var(--onacc);border-radius:12px;padding:0 16px;min-height:46px;font-weight:600;text-align:center;white-space:nowrap}
.pri.full{width:100%}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;white-space:nowrap}
.danger{color:var(--warn)}
.mu{color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.pad{padding:12px 14px}
.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:8px}
.lnk{display:block;width:100%;padding:12px 14px}
.lnk b{display:block;font-size:18px}
.acts{display:flex;gap:8px;padding:0 14px 12px}
.bar{display:flex;gap:8px;margin:0 0 12px}
.bar>*{flex:1}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;text-align:center;min-height:42px;border-radius:9px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--onacc)}
.num{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;background:var(--hl);color:var(--acc);font-weight:700;font-size:15px}
.shd{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;min-height:52px}
.cnt{color:var(--mute)}
.sb{border-top:1px solid var(--line);padding:4px 14px 12px}
.it{display:flex;align-items:center;gap:8px;min-height:44px;border-bottom:1px solid var(--line)}
.x{width:44px;height:44px;text-align:center;font-size:24px;color:var(--mute)}
.add{display:flex;gap:8px;margin-top:10px}
.gh{display:flex;align-items:center;gap:10px;font-size:17px;padding:14px 14px 4px;color:var(--mute)}
.buy{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:20px}
.box{display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--mute);border-radius:9px;flex:none;font-weight:700;color:var(--onacc)}
.buy.ck .box{background:var(--acc);border-color:var(--acc)}
.buy.ck .tx{text-decoration:line-through;text-decoration-thickness:2px;color:var(--mute)}
.tgl{display:flex;align-items:center;gap:8px;min-height:44px}
.tgl input{width:22px;min-height:22px;height:22px}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
.ic{min-width:44px;height:44px;text-align:center;font-size:20px;color:var(--mute)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:14px}
.md{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:520px;display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
.md p{margin:0;color:var(--mute)}
.md .bt{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script>
const KEY='spesa.v1';
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.shops)S={shops:[],lists:[],showCats:true};
const uid=()=>Math.random().toString(36).slice(2,9);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
if(!S.shops.length){S.shops.push({id:uid(),name:'Il mio supermercato',cats:['Frutta e verdura','Forneria','Latticini e uova','Reparto carne','Reparto pesce','Dispensa','Surgelati','Bevande','Detersivi e igiene'].map(n=>({id:uid(),name:n}))});save()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
let view={n:'home'};
const cur=()=>S.lists.find(l=>l.id===view.id);
const shopOf=l=>S.shops.find(s=>s.id===l.shopId);
const curShop=()=>S.shops.find(s=>s.id===view.id);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

function modal({title,msg,input,select,ok='Salva',danger,cb}){
 const m=document.createElement('div');m.className='ov';
 const fld=input?(input.rows>1?`<textarea rows="${input.rows}"></textarea>`:`<input autocomplete="off">`):'';
 m.innerHTML=`<div class="md" role="dialog" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${msg?`<p>${esc(msg)}</p>`:''}${select?`<select>${select.map(o=>`<option value="${o.v}">${esc(o.t)}</option>`).join('')}</select>`:''}${fld}<div class="bt"><button class="ghost" data-x="0">Annulla</button><button class="pri ${danger?'danger':''}" data-x="1">${esc(ok)}</button></div></div>`;
 document.body.appendChild(m);
 const f=m.querySelector('input,textarea'),s=m.querySelector('select');
 if(f){f.value=input.value||'';f.placeholder=input.ph||'';setTimeout(()=>{f.focus();f.select()},50)}
 const close=()=>m.remove();
 const go=()=>{const t=f?f.value.trim():'';if(f&&!t&&!input.empty)return;close();cb({text:t,sel:s?s.value:null})};
 m.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(b){b.dataset.x==='1'?go():close()}else if(e.target===m)close()});
 if(f&&input.rows<=1)f.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
}

function groups(l){const sh=shopOf(l);const g=sh.cats.map((c,i)=>({id:c.id,name:c.name,n:i+1,items:l.items.filter(x=>x.cat===c.id)}));const known=new Set(sh.cats.map(c=>c.id));const o=l.items.filter(x=>!known.has(x.cat));if(o.length)g.push({id:'_',name:'Senza categoria',n:'?',items:o});return g}

function home(){
 const ls=S.lists.map(l=>{const sh=shopOf(l),t=l.items.length,d=l.items.filter(i=>i.ck).length;
  return `<div class="card"><button class="lnk" data-act="open" data-id="${l.id}"><b>${esc(l.name)}</b><span class="mu">${esc(sh?sh.name:'Senza supermercato')}, ${d} di ${t} presi</span></button><div class="acts"><button class="ghost" data-act="dup" data-id="${l.id}">Duplica</button><button class="ghost danger" data-act="del" data-id="${l.id}">Elimina</button></div></div>`}).join('');
 return `<div class="top"><h1>Liste della spesa</h1></div><button class="pri full" data-act="newlist" style="margin-bottom:10px">Nuova lista</button><div class="bar"><button class="ghost" data-act="imp">Importa</button><button class="ghost" data-act="shops">Supermercati</button></div>${ls||'<div class="empty">Nessuna lista. Tocca «Nuova lista» per iniziare.</div>'}`;
}

function listView(){
 const l=cur();if(!l)return home();const sh=shopOf(l);
 const head=`<div class="top"><button class="ghost" data-act="home" aria-label="Torna alle liste">‹ Liste</button><h1 data-act="ren">${esc(l.name)}</h1><button class="ghost" data-act="share">Condividi</button></div><p class="mu" style="margin:0 0 10px">${esc(sh?sh.name:'')}</p><div class="seg"><button class="${view.mode==='edit'?'on':''}" data-act="mode" data-m="edit">Compila</button><button class="${view.mode==='shop'?'on':''}" data-act="mode" data-m="shop">Spesa</button></div>`;
 if(!sh)return head+'<div class="empty">Supermercato non trovato.</div>';
 const gs=groups(l);
 if(view.mode==='edit'){
  return head+gs.map(g=>{const open=view.open.has(g.id);
   return `<section class="card"><button class="shd" data-act="tog" data-cat="${g.id}" aria-expanded="${open}"><span class="num">${g.n}</span><span class="grow">${esc(g.name)}</span><span class="cnt">${g.items.length||''}</span><span class="mu">${open?'▾':'▸'}</span></button>${open?`<div class="sb">${g.items.map(i=>`<div class="it"><span class="grow">${esc(i.t)}</span><button class="x" data-act="rm" data-item="${i.id}" aria-label="Elimina ${esc(i.t)}">×</button></div>`).join('')}${g.id==='_'?'':`<form class="add" data-cat="${g.id}"><input data-in="${g.id}" placeholder="Aggiungi articolo" enterkeyhint="done" autocomplete="off"><button class="pri">Aggiungi</button></form>`}</div>`:''}</section>`}).join('');
 }
 const full=gs.filter(g=>g.items.length),t=l.items.length,d=l.items.filter(i=>i.ck).length;
 if(!t)return head+'<div class="empty">Nessun articolo. Passa a «Compila» per aggiungerne.</div>';
 return head+`<div class="row" style="justify-content:space-between;margin-bottom:10px"><label class="tgl"><input type="checkbox" data-act="togcats" ${S.showCats?'checked':''}> Mostra reparti</label><span class="mu">${d} di ${t} presi</span></div><div class="card">${full.map(g=>(S.showCats?`<h3 class="gh"><span class="num">${g.n}</span>${esc(g.name)}</h3>`:'')+g.items.map(i=>`<button class="buy ${i.ck?'ck':''}" data-act="ck" data-item="${i.id}" aria-pressed="${!!i.ck}"><span class="box">${i.ck?'✓':''}</span><span class="tx grow">${esc(i.t)}</span></button>`).join('')).join('')}</div>${d?'<button class="ghost" data-act="reset">Azzera le spunte</button>':''}`;
}

function shopsView(){
 return `<div class="top"><button class="ghost" data-act="home">‹ Liste</button><h1>Supermercati</h1></div>${S.shops.map(s=>`<div class="card"><button class="lnk" data-act="openshop" data-id="${s.id}"><b>${esc(s.name)}</b><span class="mu">${s.cats.length} reparti</span></button></div>`).join('')}<button class="pri full" data-act="newshop">Nuovo supermercato</button>`;
}

function shopView(){
 const s=curShop();if(!s)return shopsView();
 return `<div class="top"><button class="ghost" data-act="shops">‹ Indietro</button><h1 data-act="rensh">${esc(s.name)}</h1></div><p class="mu" style="margin:0 0 10px">I reparti seguono il percorso nel supermercato. Usa le frecce per cambiare l'ordine.</p>${s.cats.map((c,i)=>`<div class="card row"><span class="num" style="margin-left:14px">${i+1}</span><button class="grow lnk" style="padding:12px 4px" data-act="rencat" data-cat="${c.id}">${esc(c.name)}</button><button class="ic" data-act="up" data-cat="${c.id}" aria-label="Sposta su">↑</button><button class="ic" data-act="down" data-cat="${c.id}" aria-label="Sposta giù">↓</button><button class="ic" data-act="delcat" data-cat="${c.id}" aria-label="Elimina reparto">×</button></div>`).join('')}<form class="add addc" style="margin:14px 0"><input data-in="newcat" placeholder="Nuovo reparto" autocomplete="off"><input type="number" inputmode="numeric" min="1" placeholder="Pos." style="width:78px" data-pos><button class="pri">Aggiungi</button></form><button class="ghost danger" data-act="delsh">Elimina supermercato</button>`;
}

function render(){
 const y=window.scrollY,n=view.n+(view.id||'');
 app.innerHTML=view.n==='home'?home():view.n==='list'?listView():view.n==='shops'?shopsView():shopView();
 if(render.last===n)window.scrollTo(0,y);else window.scrollTo(0,0);
 render.last=n;
 if(view.focus){const e=app.querySelector(`[data-in="${view.focus}"]`);if(e)e.focus();view.focus=null}
}
const commit=()=>{save();render()};
const dateName=()=>'Spesa del '+new Date().toLocaleDateString('it-IT',{day:'numeric',month:'long'});

const A={
 home(){view={n:'home'}},
 shops(){view={n:'shops'}},
 open(e){view={n:'list',id:e.dataset.id,mode:'edit',open:new Set()}},
 newlist(){modal({title:'Nuova lista',input:{value:dateName()},select:S.shops.length>1?S.shops.map(s=>({v:s.id,t:s.name})):null,ok:'Crea',cb:r=>{const l={id:uid(),name:r.text,shopId:r.sel||S.shops[0].id,items:[]};S.lists.unshift(l);view={n:'list',id:l.id,mode:'edit',open:new Set()};commit()}})},
 imp(){modal({title:'Importa lista',msg:'Incolla il link ricevuto.',input:{rows:4,ph:'Link della lista'},ok:'Importa',cb:r=>importCode(r.text)})},
 dup(e){const l=S.lists.find(x=>x.id===e.dataset.id);S.lists.unshift({id:uid(),name:l.name+' (copia)',shopId:l.shopId,items:l.items.map(i=>({id:uid(),cat:i.cat,t:i.t,ck:false}))});toast('Lista duplicata')},
 del(e){const l=S.lists.find(x=>x.id===e.dataset.id);modal({title:'Eliminare la lista?',msg:'«'+l.name+'» verrà eliminata.',ok:'Elimina',danger:1,cb:()=>{S.lists=S.lists.filter(x=>x.id!==l.id);commit()}})},
 ren(){const l=cur();modal({title:'Nome della lista',input:{value:l.name},cb:r=>{l.name=r.text;commit()}})},
 share(){share()},
 mode(e){view.mode=e.dataset.m},
 tog(e){const s=view.open,k=e.dataset.cat;s.has(k)?s.delete(k):s.add(k);if(s.has(k))view.focus=k},
 rm(e){const l=cur();l.items=l.items.filter(i=>i.id!==e.dataset.item)},
 ck(e){const i=cur().items.find(i=>i.id===e.dataset.item);i.ck=!i.ck},
 togcats(){S.showCats=!S.showCats},
 reset(){cur().items.forEach(i=>i.ck=false)},
 openshop(e){view={n:'shop',id:e.dataset.id}},
 newshop(){modal({title:'Nuovo supermercato',input:{value:''},select:[{v:'',t:'Parti da un elenco vuoto'}].concat(S.shops.map(s=>({v:s.id,t:'Copia i reparti di '+s.name}))),ok:'Crea',cb:r=>{const src=S.shops.find(s=>s.id===r.sel);const s={id:uid(),name:r.text,cats:src?src.cats.map(c=>({id:uid(),name:c.name})):[]};S.shops.push(s);view={n:'shop',id:s.id};commit()}})},
 rensh(){const s=curShop();modal({title:'Nome del supermercato',input:{value:s.name},cb:r=>{s.name=r.text;commit()}})},
 delsh(){const s=curShop();if(S.lists.some(l=>l.shopId===s.id))return toast('Ci sono liste che usano questo supermercato');if(S.shops.length<2)return toast('Serve almeno un supermercato');modal({title:'Eliminare il supermercato?',msg:'«'+s.name+'» e i suoi reparti verranno eliminati.',ok:'Elimina',danger:1,cb:()=>{S.shops=S.shops.filter(x=>x.id!==s.id);view={n:'shops'};commit()}})},
 rencat(e){const c=curShop().cats.find(c=>c.id===e.dataset.cat);modal({title:'Nome del reparto',input:{value:c.name},cb:r=>{c.name=r.text;commit()}})},
 up(e){mv(e.dataset.cat,-1)},
 down(e){mv(e.dataset.cat,1)},
 delcat(e){const s=curShop(),c=s.cats.find(c=>c.id===e.dataset.cat);modal({title:'Eliminare il reparto?',msg:'Gli articoli di «'+c.name+'» nelle liste resteranno sotto «Senza categoria».',ok:'Elimina',danger:1,cb:()=>{s.cats=s.cats.filter(x=>x.id!==c.id);commit()}})}
};
function mv(id,d){const a=curShop().cats,i=a.findIndex(c=>c.id===id),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]]}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;const f=A[el.dataset.act];if(f){f(el);commit()}});
document.addEventListener('change',e=>{if(e.target.dataset.act==='togcats'){A.togcats();commit()}});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target,inp=f.querySelector('input');const t=inp.value.trim();if(!t)return;
 if(f.classList.contains('addc')){const s=curShop(),c={id:uid(),name:t},p=parseInt(f.querySelector('[data-pos]').value,10);
  if(p>=1&&p<=s.cats.length)s.cats.splice(p-1,0,c);else s.cats.push(c);view.focus='newcat'}
 else{cur().items.push({id:uid(),cat:f.dataset.cat,t,ck:false});view.focus=f.dataset.cat}
 commit();
});

const enc=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const dec=c=>{c=c.replace(/-/g,'+').replace(/_/g,'/');while(c.length%4)c+='=';const s=atob(c),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return JSON.parse(new TextDecoder().decode(b))};

async function share(){
 const l=cur(),sh=shopOf(l);
 const p={n:l.name,s:sh.name,c:sh.cats.map(c=>c.name),i:l.items.map(i=>[sh.cats.findIndex(c=>c.id===i.cat),i.t,i.ck?1:0])};
 const url=location.href.split('#')[0]+'#import='+enc(p);
 try{if(navigator.share){await navigator.share({title:'Lista: '+l.name,text:'Lista della spesa «'+l.name+'». Apri il link per importarla:',url});return}}catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(url);toast('Link copiato')}catch(e){modal({title:'Copia il link',input:{value:url,rows:5},ok:'Chiudi',cb(){}})}
}

function importCode(t){
 try{
  const m=t.match(/import=([A-Za-z0-9_-]+)/),p=dec(m?m[1]:t.trim());
  let sh=S.shops.find(s=>s.name.toLowerCase()===String(p.s).toLowerCase());
  if(!sh){sh={id:uid(),name:p.s,cats:[]};S.shops.push(sh)}
  const ids=p.c.map(n=>{let c=sh.cats.find(c=>c.name.toLowerCase()===n.toLowerCase());if(!c){c={id:uid(),name:n};sh.cats.push(c)}return c.id});
  const l={id:uid(),name:p.n,shopId:sh.id,items:p.i.map(([ci,t,ck])=>({id:uid(),cat:ids[ci]||'_x',t,ck:!!ck}))};
  S.lists.unshift(l);view={n:'list',id:l.id,mode:'edit',open:new Set()};commit();toast('Lista importata');
 }catch(e){toast('Link non valido')}
}

render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
const hm=location.hash.match(/import=([^&]+)/);
if(hm){const code=hm[1];history.replaceState(null,'',location.pathname+location.search);modal({title:'Importa lista',msg:'Hai ricevuto una lista della spesa. Vuoi aggiungerla alle tue liste?',ok:'Importa',cb:()=>importCode(code)})}
</script>
</body>
</html>
